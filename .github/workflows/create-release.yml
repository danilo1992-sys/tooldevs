name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Binaries
        run: |
          mkdir -p dist
          npm run build --if-present
          # Simulamos la creación de un binario si no existe el comando build
          echo "binary content" > dist/myapp-linux-amd64
          echo "binary content" > dist/myapp-macos-arm64
          echo "binary content" > dist/myapp-windows-amd64.exe

      - name: Generate Changelog
        id: changelog
        run: |
          # Genera un changelog basado en commits desde el tag anterior
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${{ github.ref }}^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          git log $PREVIOUS_TAG..${{ github.ref }} --oneline --pretty=format:"* %s (%h)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/*
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM (Optional)
        if: success()
        run: |
          # Descomenta y configura para usar en proyectos Node.js
          # echo "${{ secrets.NPM_TOKEN }}" > .npmrc
          # npm publish
          echo "NPM publishing skipped in this template"