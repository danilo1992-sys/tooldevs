name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # para PyPI OIDC

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install build

      - name: Build Package
        run: |
          python -m build

      - name: Generate Changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          git log "$PREVIOUS_TAG"..HEAD --oneline --pretty=format:"* %s (%h)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI (Optional)
        if: success()
        run: |
          echo "PyPI publishing skipped — configura Trusted Publishing en pypi.org"
          # Para habilitar, descomenta y configura:
          # - name: Publish to PyPI
          #   uses: pypa/gh-action-pypi-publish@release/v1⏎
